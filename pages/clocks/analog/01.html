<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Analog Clock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        .font-mono-custom {
            font-family: 'JetBrains + Mono', monospace, sans-serif;
        }

        /* Clock Container & Outer Ring */
        .clock-face {
            position: relative;
            width: min(85vw, 360px);
            aspect-ratio: 1;
            margin: 0 auto;
            border-radius: 50%;
            transition: all 0.5s ease;
        }

        /* Number position logic - Calculates polar positions for numbers 1 to 12 */
        .number-node {
            position: absolute;
            width: 40px;
            height: 40px;
            top: calc(50% - 20px);
            left: calc(50% - 20px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.25rem;
            border-radius: 50%;
            transition: color 0.3s ease;
        }

        /* Ticks around the clock perimeter */
        .tick-mark {
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            height: 100%;
            transform: translateX(-50%) rotate(var(--tick-angle));
            pointer-events: none;
        }

        .tick-mark::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: var(--tick-width, 2px);
            height: var(--tick-height, 8px);
            background-color: var(--tick-color, rgba(255, 255, 255, 0.3));
            border-radius: 2px;
        }

        /* Clock Hands */
        .hand {
            position: absolute;
            left: 50%;
            bottom: 50%;
            transform-origin: 50% 100%;
            border-radius: 999px;
            transition: transform 0.05s linear;
            will-change: transform;
        }

        /* Center Cap Pivot */
        .center-cap {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            z-index: 20;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        /* Dark Theme Styles */
        .theme-dark .clock-face {
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            border: 10px solid #334155;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.6),
                inset 0 0 30px rgba(0, 0, 0, 0.5),
                0 0 0 2px rgba(255, 255, 255, 0.05);
        }
        .theme-dark .number-node { color: #f8fafc; }
        .theme-dark .hand-hour { background: #f8fafc; box-shadow: 0 0 8px rgba(255,255,255,0.2); }
        .theme-dark .hand-minute { background: #94a3b8; }
        .theme-dark .hand-second { background: #ef4444; }
        .theme-dark .center-cap { background: #ef4444; border: 3px solid #f8fafc; }

        /* Light Theme Styles */
        .theme-light .clock-face {
            background: radial-gradient(circle at center, #ffffff 0%, #f1f5f9 100%);
            border: 10px solid #e2e8f0;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.12),
                inset 0 0 25px rgba(0, 0, 0, 0.05),
                0 0 0 2px rgba(0, 0, 0, 0.05);
        }
        .theme-light .number-node { color: #0f172a; }
        .theme-light .hand-hour { background: #0f172a; }
        .theme-light .hand-minute { background: #64748b; }
        .theme-light .hand-second { background: #ea580c; }
        .theme-light .center-cap { background: #ea580c; border: 3px solid #ffffff; }

        /* Neon / Cyber Theme Styles */
        .theme-neon .clock-face {
            background: radial-gradient(circle at center, #090d16 0%, #030712 100%);
            border: 10px solid #1f2937;
            box-shadow: 
                0 0 30px rgba(56, 189, 248, 0.25),
                inset 0 0 30px rgba(56, 189, 248, 0.15),
                0 0 0 2px #38bdf8;
        }
        .theme-neon .number-node { color: #38bdf8; text-shadow: 0 0 8px rgba(56, 189, 248, 0.6); }
        .theme-neon .hand-hour { background: #f43f5e; box-shadow: 0 0 10px #f43f5e; }
        .theme-neon .hand-minute { background: #38bdf8; box-shadow: 0 0 10px #38bdf8; }
        .theme-neon .hand-second { background: #a855f7; box-shadow: 0 0 12px #a855f7; }
        .theme-neon .center-cap { background: #a855f7; border: 3px solid #38bdf8; box-shadow: 0 0 10px #a855f7; }

        /* Minimal Luxury / Gold Theme */
        .theme-gold .clock-face {
            background: radial-gradient(circle at center, #2a2421 0%, #12100e 100%);
            border: 10px solid #d4af37;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.8),
                inset 0 0 30px rgba(212, 175, 55, 0.2),
                0 0 0 2px #fef08a;
        }
        .theme-gold .number-node { color: #fef08a; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .theme-gold .hand-hour { background: #fef08a; }
        .theme-gold .hand-minute { background: #d4af37; }
        .theme-gold .hand-second { background: #f97316; }
        .theme-gold .center-cap { background: #f97316; border: 3px solid #fef08a; }
    </style>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between transition-colors duration-500 theme-dark" id="body-root">

    <!-- Header Navigation -->
    <header class="w-full max-w-4xl mx-auto px-6 py-5 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
            <span class="font-bold text-xl tracking-tight">ChronoStudio</span>
        </div>
        
        <!-- Controls trigger -->
        <div class="flex items-center space-x-2">
            <button id="smooth-toggle" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300 border border-slate-700 transition flex items-center space-x-1.5">
                <span id="smooth-indicator" class="w-2 h-2 rounded-full bg-emerald-400"></span>
                <span id="smooth-text">Smooth Sweep</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-md mx-auto px-4 flex flex-col items-center justify-center flex-grow py-4">

        <!-- Analog Clock Container -->
        <div class="clock-face shadow-2xl my-2" id="clock">
            <!-- Ticks layer -->
            <div id="ticks-container" class="absolute inset-0 rounded-full overflow-hidden"></div>

            <!-- Numbers layer (Dynamically positioned 1-12) -->
            <div id="numbers-container" class="absolute inset-0"></div>

            <!-- Hands -->
            <div class="hand hand-hour w-2 h-[28%] z-10" id="hour-hand"></div>
            <div class="hand hand-minute w-1.5 h-[38%] z-12" id="minute-hand"></div>
            <div class="hand hand-second w-0.5 h-[42%] z-15" id="second-hand"></div>

            <!-- Center Dot Pivot -->
            <div class="center-cap w-4 h-4"></div>
        </div>

        <!-- Digital Readout & Date -->
        <div class="text-center mt-6 space-y-1">
            <div id="digital-time" class="text-4xl sm:text-5xl font-bold font-mono-custom tracking-wider drop-shadow-md">
                00:00:00 AM
            </div>
            <div id="date-display" class="text-sm sm:text-base font-medium text-slate-400 tracking-wide">
                Loading date...
            </div>
        </div>

        <!-- Theme Selector Pills -->
        <div class="mt-8 flex flex-wrap justify-center gap-2 p-1.5 bg-slate-800/60 backdrop-blur-md rounded-2xl border border-slate-700/50 shadow-inner">
            <button onclick="setTheme('dark')" class="theme-btn px-4 py-2 rounded-xl text-xs font-medium transition-all bg-slate-700 text-white shadow-sm" data-theme="dark">
                Midnight
            </button>
            <button onclick="setTheme('light')" class="theme-btn px-4 py-2 rounded-xl text-xs font-medium transition-all text-slate-400 hover:text-white" data-theme="light">
                Daylight
            </button>
            <button onclick="setTheme('neon')" class="theme-btn px-4 py-2 rounded-xl text-xs font-medium transition-all text-slate-400 hover:text-white" data-theme="neon">
                Cyber Neon
            </button>
            <button onclick="setTheme('gold')" class="theme-btn px-4 py-2 rounded-xl text-xs font-medium transition-all text-slate-400 hover:text-white" data-theme="gold">
                Lux Gold
            </button>
        </div>
    </main>

    <!-- Footer Info -->
    <footer class="w-full text-center py-4 text-xs text-slate-500 border-t border-slate-800/40">
        Precision Time Engine • Designed with dynamic polar positioning
    </footer>

    <script>
        // DOM Elements
        const numbersContainer = document.getElementById('numbers-container');
        const ticksContainer = document.getElementById('ticks-container');
        const hourHand = document.getElementById('hour-hand');
        const minuteHand = document.getElementById('minute-hand');
        const secondHand = document.getElementById('second-hand');
        const digitalTime = document.getElementById('digital-time');
        const dateDisplay = document.getElementById('date-display');
        const bodyRoot = document.getElementById('body-root');
        const smoothToggleBtn = document.getElementById('smooth-toggle');
        const smoothIndicator = document.getElementById('smooth-indicator');
        const smoothText = document.getElementById('smooth-text');

        // App State
        let isSmooth = true;
        let activeTheme = 'dark';

        /**
         * Render Clock Face Numbers (1 to 12)
         * Uses trigonometry / polar placement so numbers fit snugly inside the rim
         */
        function createNumbers() {
            numbersContainer.innerHTML = '';
            const radiusPercentage = 38; // Distance from center as % of face radius

            for (let i = 1; i <= 12; i++) {
                const numberEl = document.createElement('div');
                numberEl.className = 'number-node';
                numberEl.textContent = i;

                // Calculate angle: 12 is at top (270 deg / -90 deg), 3 is at 0 deg
                const angleInDegrees = (i * 30) - 90;
                const angleInRadians = (angleInDegrees * Math.PI) / 180;

                // Position X and Y relative to 50% center
                const x = 50 + radiusPercentage * Math.cos(angleInRadians);
                const y = 50 + radiusPercentage * Math.sin(angleInRadians);

                numberEl.style.left = `calc(${x}% - 20px)`;
                numberEl.style.top = `calc(${y}% - 20px)`;

                numbersContainer.appendChild(numberEl);
            }
        }

        /**
         * Render 60 perimeter ticks (Major ticks for hours, minor for minutes)
         */
        function createTicks() {
            ticksContainer.innerHTML = '';
            for (let i = 0; i < 60; i++) {
                const tick = document.createElement('div');
                tick.className = 'tick-mark';
                tick.style.setProperty('--tick-angle', `${i * 6}deg`);

                if (i % 5 === 0) {
                    tick.style.setProperty('--tick-width', '3px');
                    tick.style.setProperty('--tick-height', '10px');
                    tick.style.setProperty('--tick-color', 'rgba(255, 255, 255, 0.5)');
                } else {
                    tick.style.setProperty('--tick-width', '1px');
                    tick.style.setProperty('--tick-height', '5px');
                    tick.style.setProperty('--tick-color', 'rgba(255, 255, 255, 0.2)');
                }

                ticksContainer.appendChild(tick);
            }
        }

        /**
         * Update Clock Logic
         */
        function updateClock() {
            const now = new Date();

            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const milliseconds = now.getMilliseconds();

            let secondAngle, minuteAngle, hourAngle;

            if (isSmooth) {
                // Smooth continuous motion
                secondAngle = (seconds * 6) + (milliseconds * 0.006);
                minuteAngle = (minutes * 6) + (seconds * 0.1);
                hourAngle = ((hours % 12) * 30) + (minutes * 0.5) + (seconds / 120);
            } else {
                // Traditional ticking motion
                secondAngle = seconds * 6;
                minuteAngle = (minutes * 6) + (seconds * 0.1);
                hourAngle = ((hours % 12) * 30) + (minutes * 0.5);
            }

            // Apply rotational transforms
            hourHand.style.transform = `translateX(-50%) rotate(${hourAngle}deg)`;
            minuteHand.style.transform = `translateX(-50%) rotate(${minuteAngle}deg)`;
            secondHand.style.transform = `translateX(-50%) rotate(${secondAngle}deg)`;

            // Update Digital Readout
            const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            digitalTime.textContent = now.toLocaleTimeString('en-US', timeOptions);

            // Update Date Readout
            const dateOptions = { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' };
            dateDisplay.textContent = now.toLocaleDateString('en-US', dateOptions);

            requestAnimationFrame(updateClock);
        }

        /**
         * Change Visual Theme
         */
        function setTheme(themeName) {
            activeTheme = themeName;
            
            // Remove previous theme classes
            bodyRoot.classList.remove('theme-dark', 'theme-light', 'theme-neon', 'theme-gold');
            
            // Apply background color to body depending on theme
            if (themeName === 'light') {
                bodyRoot.className = "bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between transition-colors duration-500 theme-light";
            } else if (themeName === 'neon') {
                bodyRoot.className = "bg-gray-950 text-slate-100 min-h-screen flex flex-col justify-between transition-colors duration-500 theme-neon";
            } else if (themeName === 'gold') {
                bodyRoot.className = "bg-stone-950 text-amber-100 min-h-screen flex flex-col justify-between transition-colors duration-500 theme-gold";
            } else {
                bodyRoot.className = "bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between transition-colors duration-500 theme-dark";
            }

            // Update theme selector buttons styling
            document.querySelectorAll('.theme-btn').forEach(btn => {
                if (btn.dataset.theme === themeName) {
                    btn.classList.add('bg-slate-700', 'text-white', 'shadow-sm');
                    btn.classList.remove('text-slate-400');
                } else {
                    btn.classList.remove('bg-slate-700', 'text-white', 'shadow-sm');
                    btn.classList.add('text-slate-400');
                }
            });
        }

        /**
         * Toggle Sweep / Ticking Motion Mode
         */
        smoothToggleBtn.addEventListener('click', () => {
            isSmooth = !isSmooth;
            if (isSmooth) {
                smoothIndicator.className = "w-2 h-2 rounded-full bg-emerald-400";
                smoothText.textContent = "Smooth Sweep";
                secondHand.style.transition = "transform 0.05s linear";
            } else {
                smoothIndicator.className = "w-2 h-2 rounded-full bg-amber-400";
                smoothText.textContent = "Step Tick";
                secondHand.style.transition = "transform 0.1s cubic-bezier(0.4, 2.08, 0.55, 0.44)";
            }
        });

        // Initialize Clock Components
        window.onload = function () {
            createNumbers();
            createTicks();
            requestAnimationFrame(updateClock);
        };
    </script>
</body>

</html>
